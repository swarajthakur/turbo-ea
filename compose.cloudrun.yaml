# Turbo EA on Cloud Run, via `gcloud run compose up`.
#
# This is NOT docker-compose.yml with a few tweaks — Cloud Run collapses every
# service below into ONE Cloud Run service running them as sidecar containers in
# a single network namespace. That forces three differences from the local stack:
#
#   1. Every container listens on 127.0.0.1, so ports must be globally unique.
#      The static frontend moves 8080 -> 8081 (target: frontend-cloudrun) to get
#      out of the edge nginx's way.
#   2. Service names exist only in /etc/hosts, which nginx's resolver does not
#      read. The TURBO_EA_*_UPSTREAM overrides below point nginx at IP literals;
#      without them every proxied request 502s.
#   3. There is no `db` container. Cloud Run instances are ephemeral and its
#      volumes are Cloud Storage buckets over FUSE, which Postgres cannot run
#      on. Postgres lives in Cloud SQL, reached through the proxy sidecar.
#
# `ollama` is dropped too — it wants a GPU and a multi-GB model volume. Leave
# AI_PROVIDER_URL pointing at a hosted model, or leave it empty to disable AI.
#
# Placeholders (${...}) are substituted by scripts/deploy-cloudrun.sh.

name: turbo-ea

services:
  # ---- ingress ------------------------------------------------------------
  nginx:
    build:
      context: .
      target: nginx
    x-google-cloudrun:
      ingress-container: true
    ports:
      - "8080:8080"
    environment:
      TURBO_EA_PUBLIC_URL: ${TURBO_EA_PUBLIC_URL}
      TURBO_EA_TLS_ENABLED: "false"          # Cloud Run terminates TLS at the edge
      NGINX_ENABLE_IPV6: "false"
      TURBO_EA_BACKEND_UPSTREAM: http://127.0.0.1:8000
      TURBO_EA_FRONTEND_UPSTREAM: http://127.0.0.1:8081
      TURBO_EA_MCP_UPSTREAM: http://127.0.0.1:8001
    depends_on:
      - frontend
      - backend
      - mcp-server

  # ---- static SPA + drawio ------------------------------------------------
  frontend:
    build:
      context: .
      target: frontend-cloudrun            # identical to `frontend`, on 8081
    expose:
      - "8081"

  # ---- API ----------------------------------------------------------------
  backend:
    build:
      context: .
      target: backend
    expose:
      - "8000"
    environment:
      # DB_MODE=cloudsql -> 127.0.0.1, the proxy sidecar below.
      # DB_MODE=neon     -> the provider hostname; the sidecar is stripped out
      #                     of the rendered file and POSTGRES_SSL is set.
      POSTGRES_HOST: "${POSTGRES_HOST}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_SSL: "${POSTGRES_SSL}"
      # A Cloud Run instance is one process with its own pool, and instances
      # scale out — keep this small against a connection-metered database.
      DB_POOL_SIZE: "${DB_POOL_SIZE}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW}"
      DB_DISABLE_PREPARED_CACHE: "${DB_DISABLE_PREPARED_CACHE}"
      # POSTGRES_PASSWORD and SECRET_KEY are injected from Secret Manager by
      # scripts/deploy-cloudrun.sh — deliberately not in this file.
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${TURBO_EA_PUBLIC_URL}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      RESET_DB: "false"
      SEED_DEMO: "false"
      AI_SEARCH_PROVIDER: duckduckgo
    depends_on:
      - cloudsql-proxy

  # ---- MCP ----------------------------------------------------------------
  mcp-server:
    build:
      context: .
      target: mcp-server
    expose:
      - "8001"
    environment:
      TURBO_EA_URL: http://127.0.0.1:8000
      TURBO_EA_PUBLIC_URL: ${TURBO_EA_PUBLIC_URL}
      MCP_PORT: "8001"
      MCP_PUBLIC_URL: ${TURBO_EA_PUBLIC_URL}/mcp
    depends_on:
      - backend

  # ---- Cloud SQL access ---------------------------------------------------
  # Replaces the `db` service. Needs a service account with roles/cloudsql.client
  # (applied by the deploy script).
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.24.1
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--health-check"
      - "--http-address=0.0.0.0"
      - "--http-port=9090"
      - "${CLOUDSQL_INSTANCE}"
    expose:
      - "5432"
